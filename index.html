<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELEV FINANCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>:root {
  --p: #12A150;
  --p-soft: color-mix(in srgb, var(--p) 12%, transparent);
  --p-soft2: color-mix(in srgb, var(--p) 22%, transparent);
  --p-strong: color-mix(in srgb, var(--p) 82%, #000);
  --bg: #F4F6F5;
  --card: #FFFFFF;
  --card2: #F8FAF9;
  --line: #E6EAE8;
  --line2: #EEF1EF;
  --text: #111827;
  --text2: #374151;
  --muted: #6B7280;
  --pos: #16A34A;
  --pos-soft: #DCFCE7;
  --neg: #DC4C4C;
  --neg-soft: #FDECEC;
  --warn: #D97706;
  --warn-soft: #FEF3C7;
  --info: #0EA5E9;
  --info-soft: #E0F2FE;
  --muted-bar: #CBD5E1;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 2px 8px rgba(16, 24, 40, .04);
  --shadow-lg: 0 20px 50px rgba(16, 24, 40, .18);
  --r: 16px;
  --r-sm: 10px;
  --gap: 16px;
  --pad: 18px;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0B0F0D;
  --card: #141A17;
  --card2: #19201C;
  --line: #26302B;
  --line2: #1F2723;
  --text: #ECF2EE;
  --text2: #C9D3CD;
  --muted: #8C9A92;
  --pos: #34D399;
  --pos-soft: rgba(52, 211, 153, .14);
  --neg: #F87171;
  --neg-soft: rgba(248, 113, 113, .14);
  --warn: #FBBF24;
  --warn-soft: rgba(251, 191, 36, .14);
  --info-soft: rgba(14, 165, 233, .16);
  --muted-bar: #3B4A42;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-lg: 0 20px 50px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
[data-compact="1"] { --gap: 12px; --pad: 13px; }

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
[data-compact="1"] body { font-size: 13px; }
h1, h2, h3, h4 { margin: 0; letter-spacing: -.01em; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 14.5px; font-weight: 650; }
h4 { font-size: 13px; font-weight: 650; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--text2); }
p { margin: 4px 0; }
code { background: var(--card2); padding: 1px 5px; border-radius: 5px; font-size: 12px; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 9px 11px; width: 100%; outline: none; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { border-color: var(--p); box-shadow: 0 0 0 3px var(--p-soft); }
input[type="color"] { padding: 0; }
textarea { resize: vertical; }
.readonly { background: var(--card2); color: var(--muted); }

.muted { color: var(--muted); }
.small { font-size: 12px; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.warn-text { color: var(--warn); }
.right { text-align: right; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.grow { flex: 1; }
.minw0 { min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.row { display: flex; align-items: center; }
.row.gap { gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; gap: 8px; }
.align-center { align-items: center; }
.align-end { align-items: end; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.link { background: none; border: 0; padding: 0; color: var(--p-strong); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
[data-theme="dark"] .link { color: color-mix(in srgb, var(--p) 70%, #fff); }
.link:hover { text-decoration: underline; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Botões ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: var(--r-sm); font-weight: 600; font-size: 13.5px; transition: background .15s, border-color .15s, transform .08s, box-shadow .15s, color .15s; white-space: nowrap; }
.btn svg { font-size: 16px; flex: none; }
.btn:hover { background: var(--card2); border-color: color-mix(in srgb, var(--line) 50%, var(--muted)); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--p); border-color: var(--p); color: #fff; box-shadow: 0 4px 12px color-mix(in srgb, var(--p) 30%, transparent); }
.btn-primary:hover { background: var(--p-strong); border-color: var(--p-strong); box-shadow: 0 6px 16px color-mix(in srgb, var(--p) 38%, transparent); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text2); }
.btn-ghost:hover { background: var(--p-soft); border-color: transparent; color: var(--text); }
.btn-soft { background: var(--p-soft); border-color: transparent; color: var(--p-strong); }
[data-theme="dark"] .btn-soft { color: color-mix(in srgb, var(--p) 70%, #fff); }
.btn-soft:hover { background: var(--p-soft2); border-color: transparent; }
.btn-danger { background: var(--neg); border-color: var(--neg); color: #fff; }
.btn-danger:hover { background: color-mix(in srgb, var(--neg) 85%, #000); border-color: transparent; }
.hover-danger:hover { color: var(--neg) !important; background: var(--neg-soft) !important; }
.btn-sm { padding: 6px 10px; font-size: 12.5px; }
.btn-xs { padding: 4px 8px; font-size: 12px; border-radius: 8px; gap: 5px; }
.btn-xs svg { font-size: 14px; }
.btn-icon { padding: 8px; }
.btn-xs.btn-icon { padding: 5px; }

/* ---------- Topo ---------- */
.app { max-width: 1480px; margin: 0 auto; padding: 18px 22px 80px; }
.topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; box-shadow: var(--shadow); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 230px; }
.logo { width: 40px; height: 40px; flex: none; }
.brand h1 { font-size: 18px; font-weight: 800; letter-spacing: .02em; }
.brand h1 span { color: var(--p); }
.brand p { margin: 0; font-size: 12px; color: var(--muted); }
.topbar-mid { display: flex; align-items: center; gap: 12px; flex: 1; justify-content: center; flex-wrap: wrap; }
.topbar-right { display: flex; align-items: center; gap: 6px; }
.new-btn { letter-spacing: .02em; }
.save-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card2); border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; color: var(--muted); }
.save-chip svg { font-size: 14px; }
.save-chip.t-ok { color: var(--pos); }
.save-chip.t-warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.save-chip.t-danger { color: var(--neg); background: var(--neg-soft); border-color: transparent; }

.seg { display: inline-flex; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--muted); transition: background .18s, color .18s, box-shadow .18s; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
[data-theme="dark"] .seg button.on { background: var(--p-soft2); }
.seg-sm button { padding: 4px 10px; font-size: 12.5px; }
.seg .count { font-size: 11px; background: var(--line); color: var(--text2); border-radius: 999px; padding: 0 6px; min-width: 18px; text-align: center; }
.seg button.on .count { background: var(--p-soft); color: var(--p-strong); }

.month-picker { position: relative; display: inline-flex; align-items: center; gap: 2px; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 2px; }
.month-label { border: 0; background: transparent; font-weight: 700; padding: 6px 10px; min-width: 140px; border-radius: 8px; }
.month-label:hover { background: var(--p-soft); }
.today-link { margin: 0 8px 0 4px; }
.popover { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 12px; z-index: 30; width: 260px; animation: pop .16s ease; }
.months-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.months-grid button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 0; text-transform: capitalize; font-weight: 600; }
.months-grid button:hover { border-color: var(--p); }
.months-grid button.cur { border-color: var(--p); color: var(--p-strong); }
.months-grid button.on { background: var(--p); border-color: var(--p); color: #fff; }

.nav { display: flex; gap: 4px; margin: 12px 0 16px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.nav::-webkit-scrollbar { display: none; }
.nav a { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 10px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 13.5px; white-space: nowrap; transition: background .15s, color .15s; }
.nav a svg { font-size: 16px; }
.nav a:hover { background: var(--card); color: var(--text); }
.nav a.on { background: var(--card); color: var(--p-strong); box-shadow: var(--shadow); }
[data-theme="dark"] .nav a.on { color: color-mix(in srgb, var(--p) 70%, #fff); }

.demo-bar, .info-bar { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 12px; margin-bottom: 14px; font-size: 13px; }
.demo-bar { background: var(--warn-soft); color: var(--text); }
.info-bar { background: var(--info-soft); }
.info-bar.danger { background: var(--neg-soft); }
.main { animation: fade .25s ease; }
[data-anim="0"] * { animation: none !important; transition: none !important; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -4px) scale(.98); } }
.fade-in { animation: fade .2s ease; }
.loading { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 80px; color: var(--muted); font-size: 15px; }
.foot { text-align: center; padding: 26px 0 0; }

/* ---------- Página ---------- */
.page { display: flex; flex-direction: column; gap: var(--gap); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.welcome { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 18px 20px; border-radius: var(--r); background: linear-gradient(120deg, var(--p-soft), transparent 70%), var(--card); border: 1px solid var(--line); }
.alert { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--neg-soft); color: var(--text); }
.alert svg { color: var(--neg); }

/* ---------- KPIs ---------- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--gap); }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: var(--pad); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; transition: transform .18s, box-shadow .18s; }
.kpi:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(16, 24, 40, .08); }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--kc); opacity: .9; }
.kpi-p { --kc: var(--p); --ks: var(--p-soft); }
.kpi-pos { --kc: var(--pos); --ks: var(--pos-soft); }
.kpi-neg { --kc: var(--neg); --ks: var(--neg-soft); }
.kpi-info { --kc: var(--info); --ks: var(--info-soft); }
.kpi-top { display: flex; align-items: center; gap: 10px; }
.kpi-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--ks); color: var(--kc); font-size: 18px; flex: none; }
.kpi-label { font-weight: 600; color: var(--text2); font-size: 13px; }
.kpi-value { font-size: 24px; font-weight: 750; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
[data-compact="1"] .kpi-value { font-size: 20px; }
.kpi-sub { min-height: 18px; }
.kpi-foot { border-top: 1px dashed var(--line); padding-top: 8px; margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
.sub { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
.sub strong { color: var(--text); font-weight: 650; white-space: nowrap; }
.sub strong.pos { color: var(--pos); } .sub strong.neg { color: var(--neg); }

.progress { height: 7px; background: var(--line2); border-radius: 999px; overflow: hidden; }
[data-theme="dark"] .progress { background: var(--line); }
.progress > div { height: 100%; background: var(--p); border-radius: 999px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.progress-ok > div { background: var(--pos); }
.progress-danger > div { background: var(--neg); }
.progress-warn > div { background: var(--warn); }

/* ---------- Painéis ---------- */
.grid-dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); }
.span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; } .span-7 { grid-column: span 7; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: var(--pad); box-shadow: var(--shadow); min-width: 0; }
.panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.panel-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--p-soft); color: var(--p-strong); display: grid; place-items: center; font-size: 15px; }
[data-theme="dark"] .panel-icon { color: color-mix(in srgb, var(--p) 70%, #fff); }
.panel-body { min-width: 0; }

/* ---------- Gráficos ---------- */
.chart { position: relative; width: 100%; }
.chart svg { width: 100%; display: block; overflow: visible; }
.chart .grid { stroke: var(--line2); stroke-width: 1; }
[data-theme="dark"] .chart .grid { stroke: var(--line); }
.chart .axis0 { stroke: var(--line); stroke-width: 1.2; }
.chart .tick { font-size: 10.5px; fill: var(--muted); }
.chart .bar { transition: opacity .15s; transform-origin: bottom; animation: grow .5s cubic-bezier(.2,.8,.2,1); transform-box: fill-box; }
.chart g:hover .bar { opacity: .85; }
@keyframes grow { from { transform: scaleY(0); } }
.chart .line { stroke-dasharray: 2000; animation: draw 1s ease forwards; }
@keyframes draw { from { stroke-dashoffset: 2000; } to { stroke-dashoffset: 0; } }
.chart-tip { position: absolute; pointer-events: none; transform: translate(-50%, calc(-100% - 12px)); background: var(--text); color: var(--card); padding: 7px 10px; border-radius: 8px; font-size: 12px; white-space: nowrap; z-index: 5; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 2px; }
.chart-tip .dot { margin-right: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; font-size: 12px; color: var(--text2); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; flex: none; }
.chart-empty { height: 160px; display: grid; place-items: center; color: var(--muted); font-size: 13px; border: 1px dashed var(--line); border-radius: 12px; }
.donut { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.donut svg { flex: none; }
.donut .slice { transition: transform .15s, opacity .15s; transform-origin: 80px 80px; cursor: pointer; animation: fade .5s ease; }
.donut .slice.on { transform: scale(1.04); }
.donut-k { font-size: 9px; fill: var(--muted); }
.donut-v { font-size: 13px; font-weight: 700; fill: var(--text); }
.donut-legend { list-style: none; padding: 0; margin: 0; flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 6px; }
.donut-legend li { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 3px 6px; border-radius: 6px; }
.donut-legend li.on { background: var(--card2); }
.donut-legend strong { font-weight: 650; white-space: nowrap; }
.hbars { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.hbars-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 4px; }
.hbars-track { height: 8px; background: var(--line2); border-radius: 999px; overflow: hidden; }
[data-theme="dark"] .hbars-track { background: var(--line); }
.hbars-track div { height: 100%; border-radius: 999px; animation: growx .6s ease; transform-origin: left; }
@keyframes growx { from { transform: scaleX(0); } }
.flow-bal { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; text-align: center; font-size: 12px; }
.flow-bal div { display: flex; flex-direction: column; gap: 2px; background: var(--card2); border-radius: 8px; padding: 6px 2px; }

/* ---------- Próximos vencimentos ---------- */
.upcoming { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.upcoming li { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; border: 1px solid var(--line2); cursor: pointer; transition: background .15s, border-color .15s; }
.upcoming li:hover { background: var(--card2); border-color: var(--line); }
.upcoming li.overdue { border-color: color-mix(in srgb, var(--neg) 35%, transparent); background: var(--neg-soft); }
.upcoming .right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.up-date { width: 40px; flex: none; text-align: center; background: var(--p-soft); border-radius: 8px; padding: 4px 0; line-height: 1.1; }
.up-date strong { display: block; font-size: 15px; } .up-date span { font-size: 10.5px; color: var(--muted); }

/* ---------- Tabelas ---------- */
.tabs-panel { padding-top: 12px; }
.tabs-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.table th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 650; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--card); }
.table th.right { text-align: right; }
.table th.sortable { cursor: pointer; user-select: none; }
.table th.sortable:hover, .table th.on { color: var(--text); }
.sort-ind { display: inline-flex; margin-left: 3px; vertical-align: middle; transition: transform .15s; }
.sort-ind.asc { transform: rotate(180deg); }
.table td { padding: 9px 10px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
.table tbody tr { cursor: pointer; transition: background .12s; }
.table tbody tr:hover { background: var(--card2); }
.table tr.is-paid td:not(:last-child) { opacity: .88; }
.table.compare tbody tr { cursor: default; }
.desc { display: flex; align-items: center; gap: 9px; min-width: 0; max-width: 360px; }
.ticon { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; font-size: 15px; }
.ticon.pos { background: var(--pos-soft); color: var(--pos); }
.ticon.neg { background: var(--neg-soft); color: var(--neg); }
.ticon.info { background: var(--info-soft); color: var(--info); }
.ticon.warn { background: var(--warn-soft); color: var(--warn); }
.mini-tag { font-size: 10.5px; padding: 1px 6px; border-radius: 6px; background: var(--card2); border: 1px solid var(--line); color: var(--muted); margin-left: 6px; white-space: nowrap; }
.amount { font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
.amount.pos { color: var(--pos); } .amount.neg { color: var(--text); }
.actions { display: inline-flex; gap: 2px; align-items: center; justify-content: flex-end; flex-wrap: nowrap; }
.badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 650; white-space: nowrap; }
.badge-ok { background: var(--pos-soft); color: var(--pos); }
.badge-danger { background: var(--neg-soft); color: var(--neg); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-muted { background: var(--card2); color: var(--muted); border: 1px solid var(--line); }
.badge-info { background: var(--info-soft); color: var(--info); }
.ptag { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--card2); color: var(--text2); white-space: nowrap; }
.ptag-elev { background: var(--p-soft); color: var(--p-strong); }
[data-theme="dark"] .ptag-elev { color: color-mix(in srgb, var(--p) 70%, #fff); }

.invoice-strip { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.invoice-chip { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card2); cursor: pointer; }
.invoice-chip > div { display: flex; flex-direction: column; }

/* ---------- Filtros ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px; }
.filters select { width: auto; min-width: 150px; }
.filters .search { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 220px; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 0 10px; background: var(--card); }
.filters .search input { border: 0; padding: 9px 0; box-shadow: none; }
.filters .search svg { color: var(--muted); }
label.inline { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.summary-line { font-size: 13px; padding: 0 4px; }
.stat-chips { display: flex; gap: 10px; flex-wrap: wrap; }
.stat-chip { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); min-width: 120px; box-shadow: var(--shadow); transition: border-color .15s, background .15s; }
.stat-chip span { font-size: 12px; color: var(--muted); }
.stat-chip strong { font-size: 16px; }
button.stat-chip:hover { border-color: var(--p); }
.stat-chip.on { border-color: var(--p); background: var(--p-soft); }
.stat-chip.t-danger strong { color: var(--neg); } .stat-chip.t-warn strong { color: var(--warn); } .stat-chip.t-ok strong { color: var(--pos); }
.stat-chip.static { cursor: default; }

/* ---------- Parcelamentos / cartões ---------- */
.plans { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: var(--gap); }
.plan { display: flex; flex-direction: column; gap: 12px; }
.plan.done { opacity: .75; }
.plan-head { display: flex; align-items: center; gap: 10px; }
.plan-progress { display: flex; flex-direction: column; gap: 6px; }
.plan-kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv { display: flex; flex-direction: column; gap: 2px; font-size: 12px; padding: 8px 10px; background: var(--card2); border-radius: 10px; min-width: 0; }
.kv strong { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inst-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; max-height: 360px; overflow: auto; }
.inst-list li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; font-size: 13px; }
.inst-list li:nth-child(odd) { background: var(--card2); }
.inst-list li.overdue { background: var(--neg-soft); }
.inst-n { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--line2); font-size: 12px; font-weight: 700; flex: none; }
.inst-list li.paid .inst-n { background: var(--pos-soft); color: var(--pos); }
.invoices { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 6px; }
.inv-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line2); cursor: pointer; }
.inv-row:hover { background: var(--card2); }
.mini-list { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 2px; }
.mini-list li { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; font-size: 13px; }
.mini-list li:hover { background: var(--card2); }

/* ---------- Metas ---------- */
.goals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.goal-card { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--card); transition: box-shadow .15s, transform .15s; }
.goal-card:hover { box-shadow: 0 6px 20px rgba(16,24,40,.07); transform: translateY(-1px); }
.goal-nums { display: flex; align-items: baseline; gap: 6px; }
.goal-nums span:first-child { font-size: 20px; font-weight: 750; }

/* ---------- Calendário ---------- */
.cal-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--gap); align-items: start; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-grid.head { margin-bottom: 6px; }
.cal-grid.head div { text-align: center; font-size: 11.5px; font-weight: 650; color: var(--muted); text-transform: uppercase; }
.cal-cell { min-height: 86px; border: 1px solid var(--line2); background: var(--card); border-radius: 10px; padding: 6px 7px; text-align: left; display: flex; flex-direction: column; gap: 3px; transition: border-color .15s, background .15s, transform .1s; }
.cal-cell.empty { background: transparent; border-color: transparent; }
.cal-cell:not(.empty):hover { border-color: var(--p); }
.cal-cell.has { background: var(--card2); }
.cal-cell.today .cal-day { background: var(--p); color: #fff; }
.cal-cell.sel { border-color: var(--p); box-shadow: 0 0 0 3px var(--p-soft); }
.cal-day { font-weight: 700; font-size: 12.5px; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; }
.cal-dots { display: flex; gap: 3px; flex-wrap: wrap; }
.cal-amt { font-size: 11px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.k-income { background: var(--pos); } .k-fixed { background: var(--info); } .k-inst { background: #8B5CF6; } .k-overdue { background: var(--neg); } .k-paid { background: var(--muted-bar); } .k-other { background: var(--warn); }
.cal-legend { justify-content: flex-start; }
.day-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.day-list li { border: 1px solid var(--line2); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

/* ---------- Modais ---------- */
.overlay { position: fixed; inset: 0; background: rgba(10, 15, 12, .45); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; animation: fadeo .16s ease; }
@keyframes fadeo { from { opacity: 0; } }
.modal { background: var(--card); border-radius: 18px; width: 100%; max-height: calc(100vh - 40px); display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: modal .2s cubic-bezier(.2,.8,.2,1); border: 1px solid var(--line); }
@keyframes modal { from { opacity: 0; transform: translateY(10px) scale(.98); } }
.modal-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 12px; }
.modal-head h3 { font-size: 17px; }
.modal-icon { width: 38px; height: 38px; border-radius: 11px; background: var(--p-soft); color: var(--p-strong); display: grid; place-items: center; font-size: 19px; flex: none; }
[data-theme="dark"] .modal-icon { color: color-mix(in srgb, var(--p) 70%, #fff); }
.modal-body { padding: 6px 20px 16px; overflow: auto; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--card2); border-radius: 0 0 18px 18px; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-bottom: 10px; }
.span2 { grid-column: span 2; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field-label { font-size: 12.5px; font-weight: 600; color: var(--text2); }
.field-hint { font-size: 11.5px; color: var(--muted); }
.field-error { font-size: 11.5px; color: var(--neg); font-weight: 600; }
.has-error input, .has-error select, .has-error .money { border-color: var(--neg); }
.field .seg { width: fit-content; }
.money { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--card); transition: border-color .15s, box-shadow .15s; }
.money:focus-within { border-color: var(--p); box-shadow: 0 0 0 3px var(--p-soft); }
.money span { padding: 0 0 0 11px; color: var(--muted); font-weight: 600; }
.money input { border: 0; box-shadow: none !important; font-weight: 650; font-variant-numeric: tabular-nums; }
.note { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 9px 11px; border-radius: 10px; background: var(--info-soft); color: var(--text2); }
.note svg { flex: none; margin-top: 2px; color: var(--info); }
.note.soft { background: var(--card2); }
.note.soft svg { color: var(--muted); }
.note.warn { background: var(--warn-soft); }
.calc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; border-radius: 12px; border: 1px dashed var(--p-soft2); background: color-mix(in srgb, var(--p) 4%, transparent); }
.calc .span-all { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 5px; }
.details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.details .kv span:last-child { font-size: 13.5px; font-weight: 600; }
.chooser { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); transition: border-color .15s, transform .1s, box-shadow .15s, background .15s; width: 100%; }
.choice:hover { border-color: var(--p); box-shadow: 0 6px 18px rgba(16,24,40,.07); transform: translateY(-1px); }
.choice strong { display: block; font-size: 14px; }
.choice small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.choice-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; flex: none; background: var(--p-soft); color: var(--p-strong); }
.tone-pos .choice-icon { background: var(--pos-soft); color: var(--pos); }
.tone-neg .choice-icon { background: var(--neg-soft); color: var(--neg); }
.tone-warn .choice-icon { background: var(--warn-soft); color: var(--warn); }
.tone-info .choice-icon { background: var(--info-soft); color: var(--info); }
.tone-muted .choice-icon { background: var(--card2); color: var(--text2); }
.choice.tone-neg:hover { border-color: var(--neg); }

/* ---------- Configurações ---------- */
.settings { display: grid; grid-template-columns: 180px 1fr; gap: 18px; min-height: 420px; }
.settings-nav { display: flex; flex-direction: column; gap: 4px; }
.settings-nav button { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 9px 11px; border-radius: 10px; font-weight: 600; color: var(--muted); text-align: left; }
.settings-nav button:hover { background: var(--card2); color: var(--text); }
.settings-nav button.on { background: var(--p-soft); color: var(--p-strong); }
.settings-body section { padding-bottom: 14px; border-bottom: 1px solid var(--line2); }
.settings-body section:last-child { border-bottom: 0; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.swatch { width: 32px; height: 32px; border-radius: 10px; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); position: relative; cursor: pointer; display: grid; place-items: center; }
.swatch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.swatch.on { border-color: var(--text); }
.swatch.custom { background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); color: #fff; }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13.5px; }
.toggle input { display: none; }
.toggle-ui { width: 36px; height: 21px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.toggle-ui::after { content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.toggle input:checked + .toggle-ui { background: var(--p); }
.toggle input:checked + .toggle-ui::after { transform: translateX(15px); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); font-size: 12.5px; }
.chip button { border: 0; background: none; padding: 0; display: inline-flex; color: var(--muted); }
.chip button:hover { color: var(--neg); }
.storage-box { display: flex; gap: 12px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); }
.storage-box.cloud { border-color: color-mix(in srgb, var(--pos) 40%, transparent); }
.storage-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--pos-soft); color: var(--pos); font-size: 19px; flex: none; }
.storage-box.local .storage-icon { background: var(--info-soft); color: var(--info); }
.storage-box.memory .storage-icon { background: var(--neg-soft); color: var(--neg); }
.import-box { margin-top: 10px; padding: 12px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--pos) 40%, transparent); background: color-mix(in srgb, var(--pos) 5%, transparent); }
.import-box.err { border-color: color-mix(in srgb, var(--neg) 40%, transparent); background: var(--neg-soft); }
.fallback { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.fallback textarea { font-family: ui-monospace, monospace; font-size: 11.5px; }

.empty { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 28px 16px; color: var(--text2); }
.empty-icon { width: 46px; height: 46px; border-radius: 14px; background: var(--p-soft); color: var(--p-strong); display: grid; place-items: center; font-size: 22px; margin-bottom: 4px; }

.toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 80; align-items: center; }
.toast { display: flex; align-items: center; gap: 10px; background: var(--text); color: var(--card); padding: 10px 14px; border-radius: 12px; box-shadow: var(--shadow-lg); font-size: 13.5px; animation: toast .25s cubic-bezier(.2,.8,.2,1); }
.toast svg { color: var(--p); }
.toast .link { color: color-mix(in srgb, var(--p) 60%, #fff); }
.toast-err { background: var(--neg); color: #fff; }
.toast-err svg { color: #fff; }
@keyframes toast { from { opacity: 0; transform: translateY(10px); } }
.fab { display: none; position: fixed; right: 18px; bottom: 18px; width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--p); color: #fff; font-size: 26px; box-shadow: 0 10px 24px color-mix(in srgb, var(--p) 40%, transparent); z-index: 40; place-items: center; }

/* ---------- Responsivo ---------- */
@media (max-width: 1280px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .span-4 { grid-column: span 6; } .span-5, .span-7 { grid-column: span 12; }
}
@media (max-width: 1100px) {
  .topbar-mid { order: 3; flex-basis: 100%; justify-content: flex-start; }
  .cal-wrap { grid-template-columns: 1fr; }
  .plans { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .app { padding: 10px 10px 90px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-dash > * { grid-column: span 12 !important; }
  .hide-md { display: none; }
  .brand { min-width: 0; }
  .brand p { display: none; }
  .new-btn { display: none; }
  .fab { display: grid; }
  .topbar-right { margin-left: auto; }
  .grid2, .details, .chooser { grid-template-columns: 1fr; }
  .span2 { grid-column: span 1; }
  .settings { grid-template-columns: 1fr; }
  .settings-nav { flex-direction: row; overflow-x: auto; }
  .calc { grid-template-columns: 1fr 1fr; }
  .plan-kv { grid-template-columns: 1fr 1fr; }
  .cal-cell { min-height: 58px; padding: 4px; }
  .cal-amt { display: none; }
  .modal { max-height: calc(100vh - 16px); }
  .overlay { padding: 8px; align-items: flex-end; }
  .grid3 { grid-template-columns: 1fr; }
  .flow-bal { grid-template-columns: repeat(3, 1fr); }
  .table td, .table th { padding: 8px 6px; }
  .desc { max-width: 180px; }
}
@media (max-width: 520px) {
  .kpis { grid-template-columns: 1fr; }
  .hide-sm { display: none; }
  .month-label { min-width: 110px; }
  .seg button { padding: 6px 10px; }
  .save-chip span { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Celular (ajustes v2) ---------- */
@media (max-width: 820px) {
  input, select, textarea { font-size: 16px; } /* evita zoom automático no iPhone */
  .topbar { padding: 10px 12px; gap: 10px; }
  .topbar-mid { flex-direction: column; align-items: stretch; gap: 8px; }
  .topbar-mid .seg { width: 100%; flex-wrap: nowrap; }
  .topbar-mid .seg button { flex: 1; justify-content: center; padding: 8px 6px; }
  .month-picker { width: 100%; }
  .month-picker .month-label { flex: 1; }
  .popover { width: min(300px, calc(100vw - 32px)); }
  .nav { position: sticky; top: 0; z-index: 25; background: var(--bg); margin: 8px -10px 12px; padding: 6px 10px; box-shadow: 0 6px 10px -10px rgba(0,0,0,.25); }
  .nav a { padding: 9px 12px; }
  .page-head { align-items: stretch; flex-direction: column; }
  .page-head > .btn, .page-head > .row { align-self: flex-start; }
  .tabs-head { flex-direction: column; align-items: stretch; }
  .tabs-head .seg { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .tabs-head .seg::-webkit-scrollbar { display: none; }
  .tabs-head .seg button { white-space: nowrap; flex: none; }
  .tabs-head > .grow { display: none; }
  .tabs-head > .btn { align-self: flex-start; }
  .filters select { flex: 1 1 45%; min-width: 0; }
  .filters .search { flex-basis: 100%; }
  .plan-head { flex-wrap: wrap; }
  .plan-head .actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
  .inv-row { flex-wrap: wrap; }
  .invoice-chip { flex-wrap: wrap; }
  .btn-xs { padding: 7px 10px; } /* alvos de toque maiores */
  .btn-xs.btn-icon { padding: 8px; }
  .stat-chip { flex: 1 1 140px; }
  .welcome .row { width: 100%; }
  .modal-foot { position: sticky; bottom: 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  .modal-foot .btn { flex: 1; }
  .modal-foot .grow { display: none; }
  .toasts { bottom: 86px; width: calc(100% - 24px); }
  .toast { width: 100%; }
  .kpi-value { font-size: 22px; }
}
@media (max-width: 640px) {
  /* tabelas viram cartões, sem rolagem lateral */
  .table.cards-sm thead { display: none; }
  .table.cards-sm, .table.cards-sm tbody { display: block; }
  .table.cards-sm tbody tr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "desc desc val" "date cat status" "act act act"; gap: 4px 10px; padding: 11px 4px; border-bottom: 1px solid var(--line2); align-items: center; }
  .table.cards-sm td { display: block; border: 0; padding: 0; min-width: 0; }
  .table.cards-sm .c-desc { grid-area: desc; }
  .table.cards-sm .c-desc .desc { max-width: none; }
  .table.cards-sm .c-val { grid-area: val; }
  .table.cards-sm .c-date { grid-area: date; font-size: 12px; color: var(--muted); }
  .table.cards-sm .c-cat { grid-area: cat; display: block !important; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .table.cards-sm .c-status { grid-area: status; justify-self: end; }
  .table.cards-sm .c-act { grid-area: act; }
  .table.cards-sm .c-act .actions { justify-content: flex-start; gap: 4px; }
  .table.cards-sm .c-method, .table.cards-sm .c-prof { display: none; }
  .modal { border-radius: 18px 18px 0 0; max-height: 94vh; }
  .overlay { padding: 0; }
  .cal-grid { gap: 3px; }
  .cal-day { font-size: 12px; width: 22px; height: 22px; }
}
.settings-body { min-width: 0; }
.storage-box .grow { min-width: 0; overflow-wrap: anywhere; }
.modal { min-width: 0; }
.modal-body { overflow-x: hidden; }
@media (max-width: 820px) {
  .settings { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .settings-nav button { white-space: nowrap; }
}
@media (max-width: 820px) {
  .tabs-panel, .tabs-head, .tabs-head .seg { min-width: 0; max-width: 100%; }
  .tabs-head .seg { width: 100%; }
  .main, .page { min-width: 0; max-width: 100%; }
  .toasts { left: 12px; right: 12px; transform: none; width: auto; }
}
@media (max-width: 820px) {
  .btn { white-space: normal; text-align: left; max-width: 100%; }
  .goals-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .mini-list li { flex-wrap: wrap; row-gap: 4px; }
  .mini-list li > .grow { flex-basis: 50%; }
  .panel-head { flex-wrap: wrap; }
}
a.btn { text-decoration: none; color: inherit; }

/* ---------- Edição de layout ---------- */
.btn-active { background: var(--p-soft) !important; color: var(--p-strong) !important; }
.grid-dash .block { min-width: 0; display: flex; flex-direction: column; position: relative; }
.grid-dash .block > .panel, .grid-dash .block > section { flex: 1; }
.span-3 { grid-column: span 3; } .span-8 { grid-column: span 8; } .span-9 { grid-column: span 9; } .span-12 { grid-column: span 12; }
.block:not(.span-12) .kpis { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.editing-grid .block.editing { outline: 2px dashed color-mix(in srgb, var(--p) 55%, transparent); outline-offset: 4px; border-radius: var(--r); cursor: grab; transition: transform .15s, opacity .15s; }
.editing-grid .block.editing > *:not(.block-tools) { pointer-events: none; user-select: none; }
.editing-grid .block.dragging { opacity: .45; }
.editing-grid .block.drop-target { outline-style: solid; outline-color: var(--p); transform: scale(.99); }
.block-tools { order: -1; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 8px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); z-index: 3; cursor: default; animation: fade .2s ease; }
.bt-title { display: inline-flex; align-items: center; gap: 6px; font-weight: 650; font-size: 13px; cursor: grab; }
.bt-title svg { color: var(--muted); }
.bt-row { display: flex; gap: 6px; flex-wrap: wrap; }
.bt-group { display: inline-flex; align-items: center; background: var(--card2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.bt-group button { border: 0; background: transparent; min-width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--text2); }
.bt-group button:hover:not(:disabled) { background: var(--p-soft); color: var(--p-strong); }
.bt-group button.on { background: var(--p); color: #fff; }
.bt-group button:disabled { opacity: .35; cursor: not-allowed; }
.bt-val { font-size: 12px; font-weight: 700; min-width: 40px; text-align: center; }
.edit-bar { background: var(--card); border: 1px solid color-mix(in srgb, var(--p) 45%, transparent); border-radius: var(--r); padding: 12px 14px; margin-bottom: 16px; box-shadow: 0 6px 20px color-mix(in srgb, var(--p) 12%, transparent); animation: fade .2s ease; }
.edit-bar-main { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.edit-bar-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--p-soft); color: var(--p-strong); display: grid; place-items: center; font-size: 18px; }
.edit-hidden { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.edit-hidden .chip { cursor: pointer; gap: 6px; }
.edit-hidden .chip:hover { border-color: var(--p); }
.nav-editing { flex-wrap: wrap; overflow: visible; }
.nav-edit-item { display: inline-flex; align-items: center; gap: 6px; padding: 6px 6px 6px 8px; border-radius: 10px; background: var(--card); border: 1px dashed color-mix(in srgb, var(--p) 55%, transparent); font-weight: 600; font-size: 13px; color: var(--text2); cursor: grab; }
.nav-edit-item svg { font-size: 15px; }
.nav-edit-item .grip { color: var(--muted); }
.nav-edit-item.is-hidden { opacity: .5; text-decoration: line-through; }
.nav-edit-item.dragging { opacity: .4; }
.nav-edit-item input { width: 120px; padding: 3px 6px; font-size: 13px; }
.nav-edit-tools { display: inline-flex; gap: 1px; margin-left: 2px; }
.nav-edit-tools button { border: 0; background: transparent; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
.nav-edit-tools button:hover:not(:disabled) { background: var(--p-soft); color: var(--p-strong); }
.nav-edit-tools button:disabled { opacity: .3; }
@media (max-width: 1280px) {
  .grid-dash > .span-3 { grid-column: span 6; } .grid-dash > .span-8, .grid-dash > .span-9 { grid-column: span 12; }
}
@media (max-width: 820px) {
  .nav-editing { position: static; }
  .bt-title { flex-basis: 100%; }
  .nav-edit-tools button { width: 30px; height: 30px; }
}
@media (max-width: 820px) {
  .edit-bar-main > .grow { flex: 1 1 calc(100% - 52px); }
  .edit-bar-main > .btn { flex: 1; justify-content: center; }
  .nav-editing .nav-edit-item { flex: 1 1 100%; }
  .nav-editing .nav-edit-item > span:not(.nav-edit-tools) { flex: 1; }
}

/* ---------- Calendário: mês, resumo do dia e totais ---------- */
.cal-monthbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px; width: fit-content; box-shadow: var(--shadow); }
.cal-monthbar select { width: auto; min-width: 170px; font-weight: 700; text-align: center; }
.cal-monthbar .btn { text-transform: capitalize; }
.day-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.day-sum div { background: var(--card2); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.day-sum span { font-size: 11.5px; color: var(--muted); }
.day-sum b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-totals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); }
.cal-total { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: var(--pad); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; }
.cal-total::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--ck); }
.cal-total.t-in { --ck: var(--pos); --cs: var(--pos-soft); } .cal-total.t-out { --ck: var(--neg); --cs: var(--neg-soft); }
.cal-total.t-pos { --ck: var(--pos); --cs: var(--pos-soft); } .cal-total.t-neg { --ck: var(--neg); --cs: var(--neg-soft); }
.cal-total.t-bal { --ck: var(--p); --cs: var(--p-soft); }
.ct-top { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13px; color: var(--text2); }
.ct-icon { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--cs); color: var(--ck); font-size: 17px; flex: none; }
.cal-total strong { font-size: 24px; font-weight: 750; letter-spacing: -.02em; white-space: nowrap; }
.ct-sub { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.ct-sub b { color: var(--text); }
@media (max-width: 1100px) { .cal-totals { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .cal-totals { grid-template-columns: 1fr; } .cal-monthbar { width: 100%; } .cal-monthbar select { flex: 1; min-width: 0; } }

/* ---------- Menu de ordenação ---------- */
.sort-menu { position: relative; }
.sort-pop { left: auto; right: 0; transform: none; width: 300px; display: flex; flex-direction: column; gap: 6px; animation: fade .16s ease; }
.sort-pop ul { list-style: none; margin: 4px 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.sort-pop li { display: flex; align-items: center; gap: 4px; }
.sort-opt { flex: 1; display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: 9px; }
.sort-opt:hover { background: var(--card2); }
.sort-opt.on { background: var(--p-soft); }
.sort-opt b { display: block; font-size: 13px; }
.sort-opt small { display: block; font-size: 11.5px; color: var(--muted); }
.sort-radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 11px; flex: none; }
.sort-opt.on .sort-radio { background: var(--p); border-color: var(--p); color: #fff; }
.sort-dir { border: 1px solid var(--line); background: var(--card); width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; }
.sort-dir:hover { border-color: var(--p); color: var(--p-strong); }
@media (max-width: 820px) { .sort-pop { position: fixed; top: 70px; right: 12px; left: 12px; width: auto; } }
.k-card { background: #EC4899; }
.month-select { display: inline-flex; align-items: center; gap: 2px; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
.month-select button { border: 0; background: transparent; width: 30px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--text2); }
.month-select button:hover { background: var(--p-soft); color: var(--p-strong); }
.month-select select { border: 0; background: transparent; width: auto; min-width: 150px; font-weight: 700; padding: 6px 4px; box-shadow: none !important; }
@media (max-width: 820px) { .filters .month-select { flex: 1 1 100%; } .filters .month-select select { flex: 1; } }

/* ---------- Contas vinculadas e importação ---------- */
.acc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.acc-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card2); flex-wrap: wrap; }
.acc-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--info-soft); color: var(--info); display: grid; place-items: center; font-size: 18px; flex: none; }
.acc-form { border: 1px dashed var(--p-soft2); border-radius: 12px; padding: 12px; }
.import-sum { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin: 14px 0 8px; font-size: 13px; }
.import-sum > span:first-child { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }
.import-table { max-height: 48vh; overflow: auto; border: 1px solid var(--line); border-radius: 12px; }
.import-table .table td { padding: 6px 8px; }
.import-table input:not([type]), .import-table input[type="text"] { padding: 5px 8px; min-width: 180px; }
.import-table select { padding: 5px 6px; min-width: 130px; font-size: 13px; }
.import-table input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--p); }
.import-table tr.excluded td { opacity: .5; }
.import-table tr.excluded td:first-child { opacity: 1; }
.import-table thead th { position: sticky; top: 0; z-index: 1; }
.import-map { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.grid3b { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 820px) { .grid3b { grid-template-columns: 1fr; } }
</style>
